# Per-rule crypto function/pattern lists for semgrep/rules/c-legacy-crypto.yaml.
# Edit this file, then regenerate the rules file:
#   python3 semgrep/gen_rules.py
# Do not hand-edit semgrep/rules/c-legacy-crypto.yaml directly.

c-openssl-dh-key-agreement:
  - "DH_new()"
  - "DH_generate_key(...)"
  - "DH_compute_key(...)"
  - "DH_compute_key_padded(...)"
  - "DH_generate_parameters_ex(...)"

c-openssl-ecdh-key-agreement:
  - "ECDH_compute_key(...)"
  - "EVP_PKEY_derive(...)"

c-openssl-rsa-lowlevel:
  - "RSA_new()"
  - "RSA_generate_key(...)"
  - "RSA_generate_key_ex(...)"
  - "RSA_public_encrypt(...)"
  - "RSA_private_decrypt(...)"
  - "RSA_private_encrypt(...)"
  - "RSA_public_decrypt(...)"
  - "RSA_sign(...)"
  - "RSA_verify(...)"

c-openssl-ecdsa-signature:
  - "ECDSA_sign(...)"
  - "ECDSA_do_sign(...)"
  - "ECDSA_verify(...)"
  - "ECDSA_do_verify(...)"
  - "ECDSA_SIG_new()"

c-openssl-dsa-signature:
  - "DSA_new()"
  - "DSA_generate_key(...)"
  - "DSA_generate_parameters_ex(...)"
  - "DSA_sign(...)"
  - "DSA_verify(...)"
  - "DSA_do_sign(...)"
  - "DSA_do_verify(...)"

c-openssl-ec-key:
  - "EC_KEY_new()"
  - "EC_KEY_new_by_curve_name(...)"
  - "EC_KEY_generate_key(...)"

c-openssl-weak-hash:
  # bare identifiers (EVP_md5, EVP_sha1) also match function-pointer table usage
  - "EVP_md5"
  - "EVP_sha1"
  - "MD5(...)"
  - "MD5_Init(...)"
  - "SHA1(...)"
  - "SHA1_Init(...)"

# EVP rules: $ALG sits at a different argument position per sink function,
# so sinks are stored as full call templates, not bare names.
c-openssl-evp-legacy-alg-id:
  sink_patterns:
    - "EVP_PKEY_CTX_new_id($ALG, ...)"
    - "EVP_PKEY_set_type($PKEY, $ALG)"
  alg_values:
    - "EVP_PKEY_RSA"
    - "EVP_PKEY_RSA_PSS"
    - "EVP_PKEY_EC"
    - "EVP_PKEY_DSA"
    - "EVP_PKEY_DH"
    - "EVP_PKEY_ED25519"
    - "EVP_PKEY_ED448"
    - "EVP_PKEY_X25519"
    - "EVP_PKEY_X448"
    - "NID_X9_62_id_ecPublicKey"

c-openssl-evp-legacy-alg-name:
  sink_patterns:
    - "EVP_PKEY_new_from_name($LIB, $ALG, ...)"
    - "EVP_PKEY_CTX_new_from_name($LIB, $ALG, ...)"
    - "EVP_PKEY_Q_keygen($LIB, $PROP, $ALG, ...)"
  alg_regex: '"(RSA|RSA-PSS|EC|DSA|DH|DHX|X25519|X448|ED25519|ED448)"'

# ---------------------------------------------------------------------------
# Ruby: OpenSSL stdlib (OpenSSL::PKey / X509 / HMAC) + Digest
# ---------------------------------------------------------------------------

ruby-openssl-rsa:
  - "OpenSSL::PKey::RSA.new(...)"
  - "OpenSSL::PKey::RSA.generate(...)"

ruby-openssl-dh-key-agreement:
  - "OpenSSL::PKey::DH.new(...)"
  - "OpenSSL::PKey::DH.generate(...)"
  # bang form takes no arguments, so match the bare call
  - "$DH.generate_key!"
  - "$DH.compute_key(...)"

ruby-openssl-ec-key:
  - "OpenSSL::PKey::EC.new(...)"
  - "OpenSSL::PKey::EC.generate(...)"

ruby-openssl-dsa:
  - "OpenSSL::PKey::DSA.new(...)"
  - "OpenSSL::PKey::DSA.generate(...)"

ruby-openssl-signature:
  # receiver is a key or an X509::Certificate/Request; both reach .sign
  - "$K.sign(...)"
  - "$K.verify(...)"

ruby-openssl-weak-hash:
  # bare class references also match digest-class arguments and constants
  # (Ruby analog of the C `EVP_md5` function-pointer lesson)
  - "OpenSSL::Digest::MD5"
  - "OpenSSL::Digest::SHA1"
  - "Digest::MD5"
  - "Digest::SHA1"

ruby-openssl-weak-hash-byname:
  sink_patterns:
    - "OpenSSL::Digest.new($ALG)"
    - "OpenSSL::HMAC.digest($ALG, ...)"
    - "OpenSSL::HMAC.hexdigest($ALG, ...)"
    - "OpenSSL::HMAC.base64digest($ALG, ...)"
  alg_regex: '[''"](?i:md5|sha-?1)[''"]'
