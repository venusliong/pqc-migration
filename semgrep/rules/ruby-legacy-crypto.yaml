rules:
- id: ruby-openssl-rsa
  languages:
  - ruby
  severity: ERROR
  message: Ruby OpenSSL RSA key operation ($FN) is quantum-vulnerable. For key transport / encryption
    migrate to ML-KEM-768 (FIPS 203, KEM-DEM); for signatures migrate to ML-DSA-65 (FIPS 204).
  metadata:
    category: rsa
    primitive: RSA
    pqc_replacement: ML-KEM-768 (encrypt/transport) or ML-DSA-65 (sign)
    priority: P1
  patterns:
  - pattern-either:
    - pattern: OpenSSL::PKey::RSA.new(...)
    - pattern: OpenSSL::PKey::RSA.generate(...)
- id: ruby-openssl-dh-key-agreement
  languages:
  - ruby
  severity: ERROR
  message: Classic Diffie-Hellman key agreement ($FN) is quantum-vulnerable. Migrate to ML-KEM-768 (FIPS
    203); for TLS transports prefer a hybrid group such as X25519MLKEM768.
  metadata:
    category: key-exchange
    primitive: DH
    pqc_replacement: ML-KEM-768 (FIPS 203), hybrid X25519MLKEM768
    priority: P1
  patterns:
  - pattern-either:
    - pattern: OpenSSL::PKey::DH.new(...)
    - pattern: OpenSSL::PKey::DH.generate(...)
    - pattern: $DH.generate_key!
    - pattern: $DH.compute_key(...)
- id: ruby-openssl-ec-key
  languages:
  - ruby
  severity: WARNING
  message: EC key management ($FN) backs quantum-vulnerable ECDSA/ECDH usage. Migrate signatures to ML-DSA-65
    (FIPS 204) and key agreement to ML-KEM-768 (FIPS 203).
  metadata:
    category: ec-key
    primitive: EC
    pqc_replacement: ML-DSA-65 (sign) / ML-KEM-768 (kex)
    priority: P2
  patterns:
  - pattern-either:
    - pattern: OpenSSL::PKey::EC.new(...)
    - pattern: OpenSSL::PKey::EC.generate(...)
- id: ruby-openssl-dsa
  languages:
  - ruby
  severity: ERROR
  message: DSA ($FN) is quantum-vulnerable and deprecated classically. Migrate to ML-DSA-65 (FIPS 204).
  metadata:
    category: signature
    primitive: DSA
    pqc_replacement: ML-DSA-65 (FIPS 204)
    priority: P2
  patterns:
  - pattern-either:
    - pattern: OpenSSL::PKey::DSA.new(...)
    - pattern: OpenSSL::PKey::DSA.generate(...)
- id: ruby-openssl-signature
  languages:
  - ruby
  severity: ERROR
  message: Signature operation ($FN) on an OpenSSL key or X.509 certificate is quantum-vulnerable when
    the key is RSA/EC/DSA. Migrate to ML-DSA-65 (FIPS 204); use SLH-DSA (FIPS 205) for long-lived signatures.
  metadata:
    category: signature
    primitive: Sign/Verify
    pqc_replacement: ML-DSA-65 (FIPS 204) or SLH-DSA (FIPS 205)
    priority: P2
  patterns:
  - pattern-either:
    - pattern: $K.sign(...)
    - pattern: $K.verify(...)
- id: ruby-openssl-weak-hash
  languages:
  - ruby
  severity: WARNING
  message: Weak/legacy hash ($FN). MD5 and SHA-1 are classically broken for collisions; for PQC-era margin
    use SHA-256 minimum, SHA-384+ preferred.
  metadata:
    category: hash
    primitive: MD5/SHA1
    pqc_replacement: SHA-384 or SHA3-384
    priority: P3
  patterns:
  - pattern-either:
    - pattern: OpenSSL::Digest::MD5
    - pattern: OpenSSL::Digest::SHA1
    - pattern: Digest::MD5
    - pattern: Digest::SHA1
- id: ruby-openssl-weak-hash-byname
  languages:
  - ruby
  severity: WARNING
  message: Digest selected by algorithm name string ($ALG) is a weak/legacy hash. MD5 and SHA-1 are classically
    broken for collisions; for PQC-era margin use SHA-256 minimum, SHA-384+ preferred.
  metadata:
    category: hash
    primitive: MD5/SHA1(name)
    pqc_replacement: SHA-384 or SHA3-384
    priority: P3
  patterns:
  - pattern-either:
    - pattern: OpenSSL::Digest.new($ALG)
    - pattern: OpenSSL::HMAC.digest($ALG, ...)
    - pattern: OpenSSL::HMAC.hexdigest($ALG, ...)
    - pattern: OpenSSL::HMAC.base64digest($ALG, ...)
  - metavariable-regex:
      metavariable: $ALG
      regex: '[''"](?i:md5|sha-?1)[''"]'
